name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL and cppcheck
        run: sudo apt-get update && sudo apt-get install -y libssl-dev cppcheck

      - name: Static analysis (cppcheck)
        run: |
          cppcheck --enable=warning,performance,portability --error-exitcode=1 --std=c11 --language=c -Iinc src/*.c
          cppcheck --enable=warning,performance,portability --error-exitcode=1 --std=c++17 --language=c++ -Iinc src/*.cpp

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build

      - name: Run crypto tests
        run: ./build/test_crypto

      - name: Run adversarial tests
        run: ./build/attack_aead_tamper

      - name: Run replay storm attack
        run: ./build/attack_replay_storm

      - name: Run brute force attack
        run: ./build/attack_brute_force

      - name: Run DoS flood attack
        run: ./build/attack_dos_flood

      - name: Run handshake downgrade attack
        run: ./build/attack_handshake_downgrade

      - name: Run record fuzz attack
        run: ./build/attack_record_fuzz

      - name: Run intrusion pattern attack
        run: ./build/attack_intrusion_pattern

      - name: Run topic ACL bypass attack
        run: ./build/attack_topic_acl_bypass

      - name: Run all standalone tests
        run: python3 scripts/run_standalone_tests.py

  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Configure with ASan + UBSan
        run: |
          cmake -B build_asan \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -g" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build_asan

      - name: Run full suite under sanitizers
        run: |
          cd build_asan
          ctest --output-on-failure

      - name: Run all 21 standalone tests under sanitizers
        run: STANDALONE_TESTS_ASAN=1 python3 scripts/run_standalone_tests.py